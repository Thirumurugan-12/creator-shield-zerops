# Zerops deployment configuration. Keep this filename at repository root;
# Zerops GitHub pipelines discover zerops.yml automatically.
zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci && npm run build
      deployFiles:
        - apps/web/.next
        - apps/web/public
        - apps/web/package.json
        - apps/web/node_modules
        - apps/web/next.config.ts
    run:
      base: nodejs@22
      start: cd /var/www/apps/web && npm run start
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${CREATORSHIELD_API_URL}
      ports:
        - port: 3000
          httpSupport: true

  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - pip install --target apps/api/.zerops-deps -r apps/api/requirements.txt
      deployFiles:
        - apps/api
    run:
      os: ubuntu
      base: python@3.12
      prepareCommands:
        # Zerops runtime images do not permit apt repository updates. Keep
        # startup portable; media processing uses ffmpeg when present.
        - command -v ffmpeg || true
      initCommands:
        - cd /var/www/apps/api && PYTHONPATH=/var/www/apps/api:/var/www/apps/api/.zerops-deps alembic upgrade head
      start: cd /var/www/apps/api && PYTHONPATH=/var/www/apps/api:/var/www/apps/api/.zerops-deps uvicorn app.main:app --host 0.0.0.0 --port 8000
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: s3
        DATABASE_URL: ${CREATORSHIELD_DATABASE_URL}
        REDIS_URL: ${CREATORSHIELD_REDIS_URL}
        S3_ENDPOINT_URL: ${CREATORSHIELD_S3_ENDPOINT_URL}
        S3_BUCKET: ${CREATORSHIELD_S3_BUCKET}
        AWS_ACCESS_KEY_ID: ${CREATORSHIELD_S3_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${CREATORSHIELD_S3_SECRET_ACCESS_KEY}
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        SECURE_COOKIES: "true"
        CORS_ORIGINS: ${CREATORSHIELD_WEB_URL}
      ports:
        - port: 8000
          httpSupport: true

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - pip install --target apps/api/.zerops-deps -r apps/api/requirements.txt
      deployFiles:
        - apps/api
    run:
      os: ubuntu
      base: python@3.12
      prepareCommands:
        # Zerops runtime images do not permit apt repository updates. Keep
        # startup portable; media processing uses ffmpeg when present.
        - command -v ffmpeg || true
      start: cd /var/www/apps/api && PYTHONPATH=/var/www/apps/api:/var/www/apps/api/.zerops-deps python -m app.worker
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: s3
        DATABASE_URL: ${CREATORSHIELD_DATABASE_URL}
        REDIS_URL: ${CREATORSHIELD_REDIS_URL}
        S3_ENDPOINT_URL: ${CREATORSHIELD_S3_ENDPOINT_URL}
        S3_BUCKET: ${CREATORSHIELD_S3_BUCKET}
        AWS_ACCESS_KEY_ID: ${CREATORSHIELD_S3_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${CREATORSHIELD_S3_SECRET_ACCESS_KEY}
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        SECURE_COOKIES: "true"
