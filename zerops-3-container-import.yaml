project:
  name: creatorshield-3c
  description: CreatorShield three-container demo deployment
  corePackage: LIGHT
  tags:
    - creatorshield
    - demo
    - three-container
services:
  - hostname: app
    type: docker@26.1
    minContainers: 1
    maxContainers: 1
    buildFromGit: https://github.com/Thirumurugan-12/creator-shield-zerops
    zeropsSetup: app
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
  - hostname: cache
    type: valkey:single@7.2
