# Zerops application deployment configuration.
# Create services with matching hostnames using zerops-import.yaml first.
zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci && npm run build
      deployFiles:
        - apps/web/.next
        - apps/web/public
        - apps/web/package.json
        - apps/web/node_modules
        - apps/web/next.config.ts
        - apps/web/start-zerops.sh
    run:
      base: nodejs@22
      start: cd /var/www/apps/web && npm run start
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: /api
        CREATORSHIELD_API_URL: http://api:8000
      ports:
        - port: 3000
          httpSupport: true

  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - python -m pip install --no-cache-dir --target apps/api/.zerops-deps -r apps/api/requirements.txt
        - mkdir -p apps/api/vendor/ffmpeg/linux
        - PYTHONPATH=apps/api/.zerops-deps python -c "from static_ffmpeg import run; print(run.get_or_fetch_platform_executables_else_raise(download_dir='apps/api/vendor/ffmpeg/linux'))"
        - test -x apps/api/vendor/ffmpeg/linux/ffprobe
      deployFiles:
        - apps/api
        - apps/api/start-zerops.sh
    run:
      base: python@3.12
      start: /bin/sh /var/www/apps/api/start-zerops.sh
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: local
        STORAGE_PATH: /tmp/creatorshield/uploads
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        MEDIA_SIGNING_SECRET: creatorshield-zerops-media
        SESSION_SECRET: creatorshield-zerops-session
        SECURE_COOKIES: "false"
        CORS_ORIGINS: https://web-2b19-3000.prg1.zerops.app
      ports:
        - port: 8000
          httpSupport: true

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - python -m pip install --no-cache-dir --target apps/api/.zerops-deps -r apps/api/requirements.txt
        - mkdir -p apps/api/vendor/ffmpeg/linux
        - PYTHONPATH=apps/api/.zerops-deps python -c "from static_ffmpeg import run; print(run.get_or_fetch_platform_executables_else_raise(download_dir='apps/api/vendor/ffmpeg/linux'))"
        - test -x apps/api/vendor/ffmpeg/linux/ffprobe
      deployFiles:
        - apps/api
    run:
      base: python@3.12
      start: cd /var/www/apps/api && PYTHONPATH=/var/www/apps/api:/var/www/apps/api/.zerops-deps python -m app.worker
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: s3
        DATABASE_URL: ${CREATORSHIELD_DATABASE_URL}
        REDIS_URL: ${CREATORSHIELD_REDIS_URL}
        S3_ENDPOINT_URL: ${CREATORSHIELD_S3_ENDPOINT_URL}
        S3_BUCKET: ${CREATORSHIELD_S3_BUCKET}
        AWS_ACCESS_KEY_ID: ${CREATORSHIELD_S3_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${CREATORSHIELD_S3_SECRET_ACCESS_KEY}
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        SECURE_COOKIES: "true"
