# Zerops deployment configuration. Keep this filename at repository root;
# GitHub-connected pipelines deploy from the main branch.
# Zerops GitHub pipelines discover zerops.yml automatically.
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci --no-audit --no-fund && npm run build
      deployFiles: .
      addToRunPrepare: ./docker-compose.zerops-3c.yml
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker compose -f /var/www/docker-compose.zerops-3c.yml build app
      start: docker compose -f /var/www/docker-compose.zerops-3c.yml up --force-recreate app
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        STORAGE_BACKEND: local
        STORAGE_PATH: /data/uploads
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        CORS_ORIGINS: http://localhost:3000
        SECURE_COOKIES: "false"
      ports:
        - port: 3000
          httpSupport: true

  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci --no-audit --no-fund && npm run build
      deployFiles:
        - apps/web/.next
        - apps/web/package.json
        - apps/web/package-lock.json
        - apps/web/node_modules
        - apps/web/next.config.ts
        - apps/web/start-zerops.sh
    run:
      base: nodejs@22
      start: /bin/sh /var/www/apps/web/start-zerops.sh
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: /api
        CREATORSHIELD_API_URL: http://api:8000
      ports:
        - port: 3000
          httpSupport: true

  # Native Python API service. Runtime images must not run apt-get; optional
  # media tooling is detected by the application when already available.
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - pip install --target apps/api/.zerops-deps -r apps/api/requirements.txt
      deployFiles:
        - apps/api
        - apps/api/start-zerops.sh
    run:
      base: python@3.12
      prepareCommands:
        # Zerops runtime images do not permit apt repository updates. Keep
        # startup portable; media processing uses ffmpeg when present.
        - command -v ffmpeg || true
      start: /bin/sh /var/www/apps/api/start-zerops.sh
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: local
        STORAGE_PATH: /tmp/creatorshield/uploads
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        SECURE_COOKIES: "false"
        CORS_ORIGINS: https://web-2b19-3000.prg1.zerops.app
      ports:
        - port: 8000
          httpSupport: true

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - pip install --target apps/api/.zerops-deps -r apps/api/requirements.txt
      deployFiles:
        - apps/api
    run:
      os: ubuntu
      base: python@3.12
      prepareCommands:
        # Zerops runtime images do not permit apt repository updates. Keep
        # startup portable; media processing uses ffmpeg when present.
        - command -v ffmpeg || true
      start: cd /var/www/apps/api && PYTHONPATH=/var/www/apps/api:/var/www/apps/api/.zerops-deps python -m app.worker
      envVariables:
        PYTHONPATH: /var/www/apps/api:/var/www/apps/api/.zerops-deps
        STORAGE_BACKEND: s3
        DATABASE_URL: ${CREATORSHIELD_DATABASE_URL}
        REDIS_URL: ${CREATORSHIELD_REDIS_URL}
        S3_ENDPOINT_URL: ${CREATORSHIELD_S3_ENDPOINT_URL}
        S3_BUCKET: ${CREATORSHIELD_S3_BUCKET}
        AWS_ACCESS_KEY_ID: ${CREATORSHIELD_S3_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${CREATORSHIELD_S3_SECRET_ACCESS_KEY}
        MEDIA_SIGNING_SECRET: ${CREATORSHIELD_MEDIA_SIGNING_SECRET}
        SESSION_SECRET: ${CREATORSHIELD_SESSION_SECRET}
        SECURE_COOKIES: "true"
