name: CreatorShield checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creatorshield
          POSTGRES_PASSWORD: creatorshield
          POSTGRES_DB: creatorshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U creatorshield -d creatorshield"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://creatorshield:creatorshield@localhost:5432/creatorshield
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      STORAGE_PATH: /tmp/creatorshield-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.txt pytest
      - run: PYTHONPATH=. pytest -q apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run build
